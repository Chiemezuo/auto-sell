{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ tenant.name }} Dashboard — Auto-Sell</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f5; height: 100vh; display: flex; }
        .sidebar { width: 320px; background: #fff; border-right: 1px solid #e0e0e0; display: flex; flex-direction: column; }
        .sidebar-header { padding: 16px; border-bottom: 1px solid #e0e0e0; }
        .sidebar-header h2 { font-size: 16px; color: #111; }
        .sidebar-header .metrics { display: flex; gap: 12px; margin-top: 8px; font-size: 12px; color: #666; }
        .metrics span { background: #f5f5f5; padding: 4px 8px; border-radius: 4px; }
        .conversation-list { flex: 1; overflow-y: auto; }
        .conversation-item { padding: 12px 16px; border-bottom: 1px solid #f0f0f0; cursor: pointer; transition: background 0.15s; }
        .conversation-item:hover { background: #f7f8fa; }
        .conversation-item.active { background: #e8f0fe; border-left: 3px solid #1a73e8; }
        .conversation-item .wa-id { font-size: 13px; font-weight: 600; color: #111; }
        .conversation-item .preview { font-size: 12px; color: #888; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .conversation-item .state-badge { font-size: 10px; padding: 1px 6px; border-radius: 8px; display: inline-block; margin-left: 6px; }
        .state-active { background: #e6f4ea; color: #137333; }
        .state-escalated { background: #fce8e6; color: #c5221f; }
        .state-owner_handling { background: #e8f0fe; color: #1a73e8; }
        .state-co_pilot_drafting { background: #fef7e0; color: #e37400; }
        .state-awaiting_payment { background: #f3e8fd; color: #7b1fa2; }
        .main { flex: 1; display: flex; flex-direction: column; }
        .main-header { padding: 16px; background: #fff; border-bottom: 1px solid #e0e0e0; display: flex; justify-content: space-between; align-items: center; }
        .main-header h3 { font-size: 15px; }
        .main-header .actions { display: flex; gap: 8px; }
        .main-header button { padding: 6px 14px; border: 1px solid #dadce0; border-radius: 4px; background: #fff; cursor: pointer; font-size: 12px; }
        .main-header button.primary { background: #1a73e8; color: #fff; border-color: #1a73e8; }
        .main-header button:hover { background: #f1f3f4; }
        .main-header button.primary:hover { background: #1557b0; }
        .message-area { flex: 1; overflow-y: auto; padding: 16px; }
        .message { margin-bottom: 12px; max-width: 70%; }
        .message.assistant { margin-left: auto; }
        .message.user { margin-right: auto; }
        .message .bubble { padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.5; }
        .message.user .bubble { background: #e4e6eb; color: #111; border-bottom-left-radius: 4px; }
        .message.assistant .bubble { background: #1a73e8; color: #fff; border-bottom-right-radius: 4px; }
        .message.assistant.owner .bubble { background: #0d904f; }
        .message .meta { font-size: 10px; color: #999; margin-top: 4px; }
        .message.assistant .meta { text-align: right; }
        .message .feedback { margin-top: 4px; }
        .message .feedback button { background: none; border: none; cursor: pointer; font-size: 14px; opacity: 0.3; transition: opacity 0.2s; }
        .message .feedback button:hover { opacity: 1; }
        .message .feedback button.active { opacity: 1; }
        .reply-box { padding: 12px 16px; background: #fff; border-top: 1px solid #e0e0e0; display: flex; gap: 8px; display: none; }
        .reply-box.visible { display: flex; }
        .reply-box input { flex: 1; padding: 8px 12px; border: 1px solid #dadce0; border-radius: 20px; font-size: 14px; outline: none; }
        .reply-box input:focus { border-color: #1a73e8; }
        .reply-box button { padding: 8px 20px; background: #1a73e8; color: #fff; border: none; border-radius: 20px; cursor: pointer; font-size: 13px; }
        .empty-state { display: flex; align-items: center; justify-content: center; height: 100%; color: #999; font-size: 14px; }
        .draft-banner { background: #fef7e0; padding: 10px 16px; text-align: center; font-size: 13px; border-bottom: 1px solid #f9d849; display: none; }
        .draft-banner.visible { display: block; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>{{ tenant.name }}</h2>
            <div class="metrics">
                <span id="metric-active">Active: --</span>
                <span id="metric-pending">Pending: --</span>
                <span id="metric-escalated">Escalated: --</span>
            </div>
        </div>
        <div class="conversation-list" id="conversation-list"></div>
    </div>
    <div class="main">
        <div class="main-header" id="main-header">
            <h3 id="conversation-title">Select a conversation</h3>
            <div class="actions" id="actions"></div>
        </div>
        <div class="draft-banner" id="draft-banner">Bot draft is waiting for your review</div>
        <div class="message-area" id="message-area">
            <div class="empty-state">Select a conversation to view messages</div>
        </div>
        <div class="reply-box" id="reply-box">
            <input type="text" id="reply-input" placeholder="Type a reply...">
            <button id="reply-send">Send</button>
        </div>
    </div>

    <script>
        const TENANT_SLUG = "{{ tenant.slug }}";
        const WS_URL = `${location.protocol === 'https:' ? 'wss:' : 'ws:'}//${location.host}/ws/dashboard/`;
        let socket = null;
        let selectedConversationId = null;
        let conversations = [];

        function connectWS() {
            socket = new WebSocket(WS_URL);
            socket.onmessage = (e) => {
                const data = JSON.parse(e.data);
                if (data.type === 'conversation_update') {
                    loadConversations();
                } else if (data.type === 'new_message') {
                    if (data.conversation_id === selectedConversationId) {
                        appendMessage(data.message);
                    }
                    loadConversations();
                }
            };
            socket.onclose = () => setTimeout(connectWS, 3000);
        }

        async function loadConversations() {
            const resp = await fetch('/api/dashboard/conversations/');
            conversations = await resp.json();
            const list = document.getElementById('conversation-list');
            let html = '';
            for (const c of conversations) {
                const activeClass = c.id === selectedConversationId ? ' active' : '';
                const stateClass = `state-${c.state}`;
                html += `<div class="conversation-item${activeClass}" onclick="selectConversation('${c.id}')" id="conv-${c.id}">
                    <span class="wa-id">${c.customer_wa_id}<span class="state-badge ${stateClass}">${c.state}</span></span>
                    <div class="preview">${c.phase || ''} &middot; ${c.last_message_at ? new Date(c.last_message_at).toLocaleString() : ''}</div>
                </div>`;
            }
            list.innerHTML = html || '<div class="empty-state">No conversations</div>';

            let active = 0, pending = 0, escalated = 0;
            for (const c of conversations) {
                if (c.state === 'active') active++;
                if (c.state === 'awaiting_payment') pending++;
                if (c.state === 'escalated') escalated++;
            }
            document.getElementById('metric-active').textContent = `Active: ${active}`;
            document.getElementById('metric-pending').textContent = `Pending: ${pending}`;
            document.getElementById('metric-escalated').textContent = `Escalated: ${escalated}`;
        }

        async function selectConversation(id) {
            selectedConversationId = id;
            const conv = conversations.find(c => c.id === id);
            document.getElementById('conversation-title').textContent = conv ? conv.customer_wa_id : 'Conversation';
            document.querySelectorAll('.conversation-item').forEach(el => el.classList.remove('active'));
            const el = document.getElementById('conv-' + id);
            if (el) el.classList.add('active');

            const actions = document.getElementById('actions');
            const replyBox = document.getElementById('reply-box');
            if (conv && conv.state === 'owner_handling') {
                actions.innerHTML = '<button onclick="handBack()">Hand Back to Bot</button>';
                replyBox.classList.add('visible');
            } else if (conv && conv.state === 'co_pilot_drafting') {
                actions.innerHTML = '<button class="primary" onclick="approveDraft()">Send Draft</button><button onclick="rejectDraft()">Reject</button>';
                replyBox.classList.remove('visible');
            } else {
                actions.innerHTML = '<button onclick="takeOver()">Take Over</button>';
                replyBox.classList.remove('visible');
            }

            const resp = await fetch(`/api/dashboard/conversations/${id}/messages/`);
            const messages = await resp.json();
            const area = document.getElementById('message-area');
            area.innerHTML = messages.length ? '' : '<div class="empty-state">No messages yet</div>';
            for (const m of messages) {
                appendMessage(m);
            }
            area.scrollTop = area.scrollHeight;
        }

        function appendMessage(msg) {
            const area = document.getElementById('message-area');
            if (area.querySelector('.empty-state')) area.innerHTML = '';
            const div = document.createElement('div');
            div.className = `message ${msg.role}${msg.sent_by_owner ? ' owner' : ''}`;
            div.innerHTML = `<div class="bubble">${escapeHtml(msg.content)}</div>
                <div class="meta">${msg.role} &middot; ${msg.created_at ? new Date(msg.created_at).toLocaleTimeString() : ''}</div>
                ${msg.role === 'assistant' && !msg.sent_by_owner ? `
                <div class="feedback">
                    <button onclick="rateMessage('${msg.id}', 'good', this)" title="Good">👍</button>
                    <button onclick="rateMessage('${msg.id}', 'bad', this)" title="Bad">👎</button>
                </div>` : ''}`;
            area.appendChild(div);
            area.scrollTop = area.scrollHeight;
        }

        async function takeOver() {
            await fetch(`/api/dashboard/conversations/${selectedConversationId}/take-over/`, { method: 'POST' });
            loadConversations();
            selectConversation(selectedConversationId);
        }

        async function handBack() {
            await fetch(`/api/dashboard/conversations/${selectedConversationId}/hand-back/`, { method: 'POST' });
            loadConversations();
            selectConversation(selectedConversationId);
        }

        async function approveDraft() {
            await fetch(`/api/dashboard/conversations/${selectedConversationId}/hand-back/`, { method: 'POST' });
            loadConversations();
            selectConversation(selectedConversationId);
        }

        async function rejectDraft() {
            await fetch(`/api/dashboard/conversations/${selectedConversationId}/take-over/`, { method: 'POST' });
            loadConversations();
            selectConversation(selectedConversationId);
        }

        async function rateMessage(messageId, type, btn) {
            await fetch(`/api/dashboard/messages/${messageId}/feedback/`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ type })
            });
            btn.classList.add('active');
            btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.getElementById('reply-send').addEventListener('click', async () => {
            const input = document.getElementById('reply-input');
            const content = input.value.trim();
            if (!content || !selectedConversationId) return;
            await fetch(`/api/dashboard/conversations/${selectedConversationId}/reply/`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content })
            });
            input.value = '';
            selectConversation(selectedConversationId);
        });

        document.getElementById('reply-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('reply-send').click();
        });

        connectWS();
        loadConversations();
        setInterval(loadConversations, 10000);
    </script>
</body>
</html>
